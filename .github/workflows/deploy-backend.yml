name: Deploy Backend to Render

on:
  push:
    branches: [FE]
    paths:
      - 'BE/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BE/package-lock.json

      - name: Install deps (sanity check)
        run: npm ci

      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Health smoke test
        run: |
          echo "Waiting for deploy to settle..."
          sleep 60
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_HEALTH_URL }}")
          echo "Health status: $code"
          test "$code" = "200"
